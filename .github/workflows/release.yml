# Builds the Windows installer and publishes it as a GitHub Release.
#
# To release: set the new version in package.json, merge to main, then push a tag:
#   git tag v0.2.0 && git push origin v0.2.0
# The release appears on GitHub with the installer and the file the app's updater reads (latest.json),
# and the website's download button picks it up straight away.
#
# "Run workflow" on the Actions tab builds a test installer (as a downloadable artifact) without releasing.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version $version"
            exit 1
          fi

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed copies of Quay accept it. Stored as repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Quay __VERSION__'
          releaseBody: |
            **Download:** the `…x64-setup.exe` file below, then run it.

            Windows may say "Windows protected your PC" because the installer isn't code-signed yet. Click **More info**, then **Run anyway**.

            Already have Quay? It will offer this update by itself the next time you open it.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/') }}
